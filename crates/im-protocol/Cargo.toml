[package]
name = "im-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IM1.0 WS 帧 / 错误响应 / 消息 content schema"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
im-common = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 2026-10-06: 量化 aux-06 A-008 的帧解析开销。criterion 此前是 workspace 级
# 声明但**全仓零使用**(连一个 benches/ 目录都没有) —— 现在开始真正用它。
criterion = { workspace = true }

[[bench]]
name = "ws_frame_parse"
path = "benches/ws_frame_parse.rs"
harness = false
