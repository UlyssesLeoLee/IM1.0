[package]
name = "jobctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "IM1.0 运维 CLI —— DLQ 的人工处置出口(aux-08 §G)"

[lints.rust]
unsafe_code = "forbid"

[lib]
name = "jobctl"
path = "src/lib.rs"

[[bin]]
name = "jobctl"
path = "src/main.rs"

[dependencies]
# `database_url()` / `connect()` 直接复用 im-migrate: 它是本仓**唯一**持有
# `IM_POSTGRES_URL` 约定的 crate, 复用后运维 CLI 与迁移器的「连接串从哪来、
# 缺失时报什么」是同一套, 不会各自长出第二个约定。
im-migrate = { workspace = true }
im-common = { workspace = true }
im-core = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
