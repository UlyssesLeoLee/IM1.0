name: CI

on:
  # 2026-10-02 修:dev 是车道合入的集成分支,原先只监听 main,
  # 导致 dev 上所有真实改动从不跑 CI(静默系统性缺口)。
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# 5 个 job: lint / test-unit / test-integration / sast / dist-linux
# 全部用 PostgreSQL 18.6 服务(与 BasicDesign §5 一致,2026-08-26 锁 patch 18.6)

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      # 2026-10-04: 所有 action 由 tag/分支改为钉 commit SHA。
      # 依据: semgrep `github-actions-mutable-action-tag`(29 条 finding 里的 22 条)。
      # tag 可被仓库所有者**静默重指向**到任意 commit —— 这是真实的供应链攻击面,
      # 而本仓的 CI runner 能拿到 ghcr.io 推送凭据与部署 kubeconfig。
      # 尾注释保留可读版本号, 便于日后 bump。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # 该 action 的 `@stable` 是**分支语义**(表示「用最新 stable Rust」),
          # 直接把 ref 换成 SHA 会丢掉它、从而把 Rust 版本永久冻结。
          # 故钉 action 的 SHA, 同时用 `toolchain:` 显式保留「跟随最新 stable」。
          toolchain: stable
          components: clippy, rustfmt
      - name: install protoc
        # crates/im-proto 的 build.rs 走 tonic-build -> prost-build, 需要 protoc 可执行文件。
        # GitHub 的 ubuntu-latest runner **不预装 protoc**, 缺失时 im-proto 编译直接失败:
        #   Could not find `protoc` ... exited with status 1
        # 该失败会连带击穿本 job 及其余所有编译 workspace 的 job(lint/unit/integration/sast),
        # 但本机有 C:\protoc\bin\protoc.exe, 所以本地全绿完全掩盖了它。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: aux-01 naming check
        # 2026-10-04: 此前本步骤是**恒通过的占位符**, 只 echo 一行字, 注释里明写
        # "placeholder: no automated aux-01 §J naming check is enforced here"。
        # 即 aux-01 §J「命名违规 → CI 失败」对本仓的 DB / proto / 文件命名层
        # 一直是**不成立的**声明 —— 与 797b5bb 修掉的 semgrep 假绿灯同一类缺陷。
        #
        # 现补上 scripts/check-naming-convention.ps1 做真检查, 覆盖 aux-01
        # §D(迁移名/表/列/索引/约束/触发器) + §E(proto package/service/message/rpc)
        # + §F(Rust 文件与模块目录/proto 文件名) + §I(禁用 status、禁用 room/chat)。
        #
        # 判别力已用变异测试证明: 24 个用例, 0 失败 ——
        #   - 18 项注入违规(表名 PascalCase / 列名 camelCase / 索引缺 idx_ 前缀 /
        #     package 大写 / message 驼峰 / rpc 缺 Request 后缀 / 返回未声明类型 /
        #     Message_Router.rs / chat_rooms 表 / status 列 ...) 全部被捕获并点名;
        #   - 1 项**对照组**(完全不改动)保持绿灯, 用来区分"门禁能发现违规"与
        #     "测试装置永远失败";
        #   - 2 项解析退化(删迁移 / 删 rpc)返回 exit 2 而非假装通过, 这是脚本内
        #     基线下限守卫的作用: 正则一旦失配, 0 违规与"仓库干净"无法区分;
        #   - 2 项**反例守卫**: google.protobuf.Empty 与 migrations/README.md
        #     必须放行, 防止把正常写法误判成违规;
        #   - 1 项跨平台回归用例: 迁移文件改名成 .SQL 在 Linux 上必须仍被抓到
        #     (Get-ChildItem -Filter 在 Linux 大小写敏感, 曾经会整个漏掉)。
        #
        # 该检查是纯 PowerShell, 不需要 cargo, 因此放在本 job 而非 sast job ——
        # 排在 cargo audit 之后会重演"audit 长期红 → 后续 step 全被跳过"的级联。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/check-naming-convention.ps1

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: im
          POSTGRES_PASSWORD: im
          POSTGRES_DB: im_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://im:im@localhost:5432/im_test
      # 2026-10-03 新增。仓内配置读取一律走 IM_<UPPER_SNAKE> 规则
      # (见 im_common::config::AppConfig), 只有 DATABASE_URL 会让
      # im-migrate 的 e2e 用例**静默跳过**(它找不到变量就 return, 不报错)。
      # 两个变量指向同一个库, 但必须都设 —— 少一个就少一批测试在跑,
      # 而且从输出上看不出来。
      IM_POSTGRES_URL: postgres://im:im@localhost:5432/im_test
      # 2026-10-03 新增: 让「连不上 PG 就静默跳过」在 CI 里变成**硬失败**。
      # 本机没 PG 时跳过是合理的(否则无 PG 的开发机全红), 但 CI 明确挂了
      # PG service container —— 此时跳过意味着 job 配错了, 而「跳过」在
      # test harness 里就是「通过」, 配置错误会以绿灯的形式混过去。
      # 真实教训: 2026-10-03 本机 Docker 停掉后, 6 个 WS e2e 全部「通过」,
      # 实际一个都没跑。见 docs/gap-ledger.md §1.15 / §1.22。
      IM_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable   # 钉 action 的 SHA 后需显式保留「跟随最新 stable」语义
      - name: install protoc
        # 见 lint job 内的同名校验说明: ubuntu runner 不预装 protoc,
        # 缺失会让 im-proto 的 build.rs 失败并击穿所有编译 workspace 的 job。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo test (unit)
        run: cargo test --workspace --lib --no-fail-fast

  test-integration:
    name: Integration Tests (PG + NATS + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: im
          POSTGRES_PASSWORD: im
          POSTGRES_DB: im_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # 2026-10-04: NATS **不用 services 块**, 改由 `start NATS (JetStream)`
      # 步骤用 `docker run` 拉起。两个原因都是实测的, 不是推断:
      #   1. GitHub Actions 的 `services.<id>` **不支持传 command/args**,
      #      而 `nats:2.10-alpine` 的**默认配置既不开 JetStream 也不开 8222
      #      monitoring**(实测容器内 `netstat -ltn` 只有 4222 在 LISTEN)。
      #      没有 `--jetstream`, `create_or_update_stream` 必然失败, 于是
      #      `NatsEventPublisher::connect` 直接 Err —— 而断言「事件进了
      #      JetStream」的那个用例本就要求 JetStream 必须开着。
      #   2. 若同时保留一个默认配置的 service, 它会和 `docker run` 抢 4222
      #      端口, 导致后者 bind 失败。故此处**不留** service 条目。
    env:
      DATABASE_URL: postgres://im:im@localhost:5432/im_test
      # 见 test-unit job 内同名校验: 少设这个变量, im-migrate 的 e2e 会静默跳过
      IM_POSTGRES_URL: postgres://im:im@localhost:5432/im_test
      # 2026-10-04 新增, 与 IM_REQUIRE_PG 同构。D-3 的 NATS 集成测试靠它把
      # 「连不上 NATS」变成硬失败; 少了它, 那几个用例会全部静默跳过而 job
      # 照样报绿 —— 这正是本 job 已经为 PG 栽过一次的坑。
      IM_NATS_URL: nats://localhost:4222
      IM_REQUIRE_NATS: "1"
      # 2026-10-03 新增: 让「连不上 PG 就静默跳过」在 CI 里变成**硬失败**。
      # 本机没 PG 时跳过是合理的(否则无 PG 的开发机全红), 但 CI 明确挂了
      # PG service container —— 此时跳过意味着 job 配错了, 而「跳过」在
      # test harness 里就是「通过」, 配置错误会以绿灯的形式混过去。
      # 真实教训: 2026-10-03 本机 Docker 停掉后, 6 个 WS e2e 全部「通过」,
      # 实际一个都没跑。见 docs/gap-ledger.md §1.15 / §1.22。
      IM_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable   # 钉 action 的 SHA 后需显式保留「跟随最新 stable」语义
      - name: install protoc
        # 见 lint job 内的同名校验说明: ubuntu runner 不预装 protoc,
        # 缺失会让 im-proto 的 build.rs 失败并击穿所有编译 workspace 的 job。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: start NATS (JetStream)
        # 2026-10-04 新增 (D-3)。见上方 services 区块的说明: 必须用
        # `docker run` 而非 `services.nats`, 因为 service 块传不了 args,
        # 而 JetStream 与 8222 monitoring 都要靠 args 打开。
        #
        # ## 为什么把 pull 和 run 拆成两步 (run 37260950792 教训)
        #
        # 第一次写成 `docker run -d ...` 然后 30s 内轮询 8222。CI 上失败,
        # 根因是日志里那句 `Unable to find image 'nats:2.10-alpine' locally`
        # —— runner 首次拉镜像, **拉取耗时吃掉了整个就绪窗口**, 于是就绪判据
        # 根本没机会被认真检查。本机之所以 1s 就绪, 只是因为镜像早就在本地缓存。
        #
        # 拆开后: ① 拉取失败可归因(而不是伪装成就绪超时); ② 就绪窗口只用来
        # 等 NATS 自己起来, 不含拉取; ③ 循环里检查容器**是否还活着** ——
        # 容器若已退出, 立刻打印 logs 并失败, 而不是干等 30s 才报一个
        # 掩盖真因的「did not become ready」。
        run: |
          set -euo pipefail
          docker rm -f im10-nats-ci >/dev/null 2>&1 || true
          echo "::group::pull nats:2.10-alpine"
          # 有界重试: Docker Hub 的 manifest 拉取会偶发 EOF(本机实测到过
          # `failed to copy: httpReadSeeker ... EOF`)。这是**注册表网络抖动**,
          # 不是代码问题, 故重试而不是把 job 判红 —— 但仍是有限次, 且最后一次
          # 失败会把 docker 的原始错误原样抛出(`|| true` 不吞)。
          for attempt in 1 2 3; do
            if docker pull nats:2.10-alpine; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "::error::docker pull nats:2.10-alpine failed after 3 attempts"
              exit 1
            fi
            echo "pull attempt ${attempt} failed; retrying in 10s"
            sleep 10
          done
          echo "::endgroup::"
          docker run -d --name im10-nats-ci \
            -p 4222:4222 -p 8222:8222 \
            nats:2.10-alpine \
            --jetstream --store_dir=/data -m 8222
          for i in $(seq 1 45); do
            # 容器已退出 => 立刻拿到真因, 不要用「超时」掩盖它
            if [ "$(docker inspect -f '{{.State.Running}}' im10-nats-ci 2>/dev/null || echo false)" != "true" ]; then
              echo "::error::NATS container exited during startup"
              docker logs im10-nats-ci || true
              exit 1
            fi
            # 就绪判据: 8222 monitoring 可达(它证明进程在监听, 而不只是容器在跑)
            if wget -q -O - http://localhost:8222/ >/dev/null 2>&1; then
              echo "NATS JetStream ready after ${i}s"
              docker exec im10-nats-ci wget -q -O - 'http://localhost:8222/jsz?streams=1' | head -12
              exit 0
            fi
            sleep 1
          done
          echo "::error::NATS did not become ready within 45s (container still running)"
          docker logs im10-nats-ci || true
          exit 1
      - name: run migrations
        # 2026-10-03 改用仓内自己的 im-migrate 二进制(此前是 sqlx CLI)。
        #
        # 两个理由, 第二个更重要:
        #   1. 少一步 `cargo install sqlx-cli`(编译整个 CLI, 数分钟)。
        #   2. **CI 跑的必须是我们要部署的那段代码**。用 CLI 建 schema 的话,
        #      我们的迁移二进制在 CI 上从未被执行过 —— 而它正是
        #      migrate-job.yaml 里实际跑的东西。改用自己之后, 每次 CI 都在
        #      验证真实的部署路径。
        #
        # 变量名与 AppConfig.postgres_url 一致(不是 sqlx CLI 惯例的
        # DATABASE_URL), 故显式传 --database-url。
        run: cargo run -p im-migrate --release -- --database-url "$IM_POSTGRES_URL"
      - name: cargo test (integration)
        # 2026-10-02 修正:集成用例已不"尚少"——crates/*/tests/ 共 6 个文件 66 个
        # #[test]/#[tokio::test],其中 pg_repos_integration.rs 的 22 个跑真实 PG。
        # 命令保持 cargo test --workspace:它会连 lib tests 一起跑(与 test-unit 重叠),
        # 这是既有行为,不在本次修正范围内。
        run: cargo test --workspace --no-fail-fast

  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable   # 钉 action 的 SHA 后需显式保留「跟随最新 stable」语义
          components: clippy
      - name: install protoc
        # 见 lint job 内的同名校验说明: ubuntu runner 不预装 protoc,
        # 缺失会让 im-proto 的 build.rs 失败并击穿所有编译 workspace 的 job
        # (sast job 跑 cargo audit 前会先构建依赖图, 同样踩到)。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit
      - name: check error codes consistency (aux-03)
        # 2026-10-03: 此前本步骤是**恒通过的占位符**, 只 echo 一行字, 注释里明写
        # 「不能当门禁看」—— 因为它引用的 scripts/check_error_codes.sh 从不存在
        # (连 .sh 后缀都是错的, scripts/ 下无此文件)。
        # 现补上 scripts/check-error-codes.ps1 做真检查, 三项均为精确匹配(零误报):
        #   1. error.rs 枚举变体 ↔ as_str() wire 名一一对应且唯一
        #   2. aux-03 §B 权威表的 code 列 ↔ 枚举 wire 名集 双向完全相等
        #   3. 全仓 crates/**/*.rs 的 ErrorCode::X 用法均指向真实变体
        # 变异测试已验证判别力: 把 EnvironmentDisabled 的 wire 名改成别的, 本检查
        # 双向各报一条并 exit 1。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/check-error-codes.ps1
      - name: check OpenAPI drift (spec vs routes)
        # 2026-10-05 新增。此前全仓**没有任何** OpenAPI/AsyncAPI 文件 ——
        # 对外只有 core.proto, 接入方要自己读代码才能知道有哪些端点、各自
        # 收什么字段、失败时返回哪个错误码。
        #
        # 现补 docs/api/openapi.json (3.1.0) + 本漂移门禁。门禁做五件事:
        #   1. 从 main.rs / http/mod.rs / ws/router.rs 重新推导路由表, 与规范
        #      **双向**比对 (规范有而代码没有 / 代码有而规范没有, 都会红)
        #   2. 规范引用的每个错误码必须存在于 aux-03 §B(21 项权威表, 已由
        #      上一个步骤钉到 im_common::ErrorCode 枚举)
        #   3. operationId 必须存在且唯一
        #   4. 所有 $ref 必须可解析; 禁止 TODO/待定/example.com 一类占位符
        #   5. 每个 bearer 保护的 operation 必须声明 503 并引用
        #      SERVICE_UNAVAILABLE —— http/auth.rs 在 token service 未配置时
        #      对**任何**已鉴权请求都会返 503, 那条路径独立于 handler
        #
        # 路由解析用括号深度栈: scope("X") 在其所在括号组闭合后失效。这让
        # `.service(web::scope("/v1").configure(http::configure))` 之后的
        # `.route("/healthz", ...)` 不会错误继承 /v1 前缀 —— 而"最后一个
        # scope 胜出"的纯文本扫描恰好会把这件事做反。
        #
        # 判别力已用变异测试证明: 18 个用例 0 失败 —— 1 个对照组(未变异必须绿)、
        # 12 个注入缺陷(删/加/改路径、换方法、移 scope、重复 operationId、
        # 引用不存在的错误码、占位符、悬空 $ref、删 x-error-codes、删 503、
        # 出现第二个 configure 委托)、1 个解析退化(JSON 坏掉必须 exit 2
        # 而不是当成通过)、3 个反例守卫(注释里的不平衡括号、注释里的 //、
        # 长得像路由的字符串, 都**不得**让门禁变红)。
        #
        # 纯 PowerShell, 不需要 cargo, 故与上面的 aux-03 检查并列。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/check-openapi.ps1
      - name: check API quickstart drift (端点表 vs openapi.json)
        # 2026-10-06 新增。接入方**只看 quickstart**, 不看 openapi.json ——
        # 所以 quickstart 会独立腐烂: 加了端点没更新文档、或改了 path 没更新
        # 文档, 都没有任何东西会红, 直到某个接入方照着文档打过去拿到 404。
        #
        # 本门禁对**两个方向**都判: 文档写了而 spec 没有(= 文档在骗人),
        # 以及 spec 有而文档漏了(= 文档漏了新能力)。外加正文里那句
        # 「N 个 operation」也必须与 spec 对得上。
        #
        # fail-closed: 表格一条都解析不出来时**判失败**而不是当成「0 违规」。
        # 这不是假想 —— 首次跑时作者自己的正则把 method 写在第一列, 而表里
        # 第一列是分组名, 于是一行都没匹配上; 是这段守卫把它变成了一次显式失败,
        # 否则就是一个永远绿的检查。
        #
        # 判别力已用变异测试证明, 6 处全部 RED: 整行删端点 / 加不存在的端点 /
        # 路径拼错 / 正文数量不符 / 表格形状改变 / method 写小写。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/check-api-quickstart.ps1
      - name: preflight regression (配置自检的变异测试)
        # 2026-10-06 新增。`packaging/template/scripts/preflight.ps1` 是接入方
        # 启动服务前唯一的自查手段, 它随 release 包发给外部用户 —— 所以它坏了
        # 不只是本仓的问题。
        #
        # 本步做两件事: ① 喂 12 份配置(1 对照 + 11 变异), 断言正确的过、坏的挂;
        # ② **泄露断言** —— 密钥/pepper 原文绝不能出现在输出里。
        #
        # 为什么必须有 ②: preflight 的全部价值就是「告诉你哪儿不对, 但不打印
        # 你的值」。若哪天有人图省事把值打出来, 它就变成一个主动泄密的工具。
        #
        # 为什么变异组里有一半是「宽松 JSON」: PowerShell 的 ConvertFrom-Json
        # 会放行无引号键/单引号/尾随逗号/**截断的 JSON**, 而 Rust 侧 serde_json
        # 全部拒绝。用宽松解析器当门禁 -> preflight 放行、服务拒绝。
        # 这 4 条用例就是为此存在的, 2026-10-06 当场抓出该 bug。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-preflight.ps1
      - name: check AsyncAPI drift (WS frames vs im-protocol serde)
        # 2026-10-05 新增。OpenAPI 覆盖 HTTP 面, 但 WebSocket 面此前**完全没有**
        # 机器可读描述 —— 接入方要自己读 im-protocol 的 Rust 源码反推帧的 JSON
        # 形状。对「主要用于集成」的产品, 这是最大的接入障碍。
        #
        # docs/api/asyncapi.json (3.0.0) 的每个字段**逐个取自 serde 派生**,
        # 不取自 aux-13 的样例 JSON —— ImplementationSpec 处于 [PROTOCOL-FROZEN],
        # 样例与代码在 content 内层 kind、ErrorBody.ts 等多处冲突, 以代码为准。
        #
        # 门禁做五件事:
        #   1. 变体名双向比对: 每个 Rust 枚举变体都要有一个被 operation 引用的
        #      schema, 其 properties.type.const 等于 snake_case 后的 wire 值;
        #      反向也要成立
        #   2. 字段名双向比对: 每个变体字段都要出现在 schema 的 properties 里
        #   3. **required 标志**逐字段核对(核心检查)—— serde 给 Option<T> 三种
        #      截然不同的行为, 产生不同的 JSON:
        #        (a) 无属性            -> 恒序列化, None 时为 null
        #        (b) 仅 serde(default) -> **同样恒序列化**, default 只影响反序列化
        #        (c) default + skip_serializing_if -> key 整个消失
        #      故: 有 skip 不得 required, 无 skip 必须 required。写反了会描述出
        #      服务端**永远不会发出**的形状, 且不产生任何运行期错误
        #   4. 所有 $ref 可解析
        #   5. 手工核对的基线(8/10/6 个变体、19 条 message), 使解析失败导致的
        #      空集合不会读成「无漂移」
        #
        # discriminator 索引**按方向分别建立**: `typing` 在上下行都存在
        # (ClientFrame::Typing 与 ServerFrame::Typing), 全局索引会让一条静默
        # 覆盖另一条。索引来源是 operation 的 message 列表, 这同时意味着
        # 一个 schema 只有被 operation 真正引用才可能满足某个方向。
        #
        # 判别力已用变异测试证明: 13 个用例 0 失败 —— 1 个对照组、8 个注入缺陷
        # (删/加字段、skip 字段标 required、恒序列化字段标可选、改 const、
        # 从 operation 删 message、悬空 $ref、破坏 message 数基线)、
        # 2 个反例守卫(auth_ok 豁免仍放行; 注释里长得像变体的文本必须被忽略)、
        # 2 个解析退化(Rust 括号坏掉、JSON 坏掉, 均必须 exit 2 而非当成通过)。
        # 源文件改前改后 SHA256 一致。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/check-asyncapi.ps1
      - name: semgrep
        # 2026-10-04 换掉 `uses: returntocorp/semgrep-action@v1`。
        #
        # ## 为什么换(这是一个**假绿灯**, 且不是偶发)
        #
        # 1. 那个 action **吞掉了 semgrep 的非零退出码**。CI run 37164873402 里
        #    semgrep 实际崩在:
        #      ValueError: invalid rule severity value: MEDIUM
        #    (`p/owasp-top-ten` 有 11 条规则把 severity 写成 MEDIUM, 而 semgrep 的
        #     RuleSeverity 枚举只认 INFO/WARNING/ERROR/INVENTORY/EXPERIMENT),
        #    整个 Static Analysis job 却报 success —— **一个崩掉的门禁报绿**。
        #    本机已复现: 四个包全开 -> semgrep `exit=2`; 排掉那 12 条后 `exit=0`。
        # 2. 在此之前 semgrep **一次都没真跑过**: cargo audit 长期红 -> 本步骤
        #    被跳过 -> errcodes / ps1lint 也一起被跳过(它们排在 audit 之后)。
        #    所以「CI 有 semgrep 门禁」这句话此前是**不成立的**。
        #
        # action 的文档只承诺「发现问题时非零退出」, **没承诺「工具崩溃时非零退出」**,
        # 实测也没做到。改为直接调 CLI 后, 退出码由 bash 原生传播, 不再依赖
        # 第三方 action 的错误处理。
        run: |
          set -euo pipefail
          # 用 venv 而不是直接 `python3 -m pip install`: ubuntu-latest 现已是 24.04,
          # 系统 python 带 PEP 668 的 EXTERNALLY-MANAGED 标记, 直接 pip install 会被拒
          # (本机 WSL 上刚踩到过: "externally-managed-environment", pip 根本装不上)。
          # venv 既绕开该限制, 也不污染 runner 的系统包。
          python3 -m venv "$RUNNER_TEMP/semgrep-venv"
          "$RUNNER_TEMP/semgrep-venv/bin/pip" install --quiet "semgrep==1.36.0"
          # 排掉上面那 11 条 severity 非法的规则。它们**全是 JS/Python 生态的
          # 供应链规则**(bun/npm/pnpm/yarn/poetry/bundler/dependabot/renovate/uv),
          # 对本仓 95 个 .rs 文件永远不可能命中, 故排除零覆盖损失; 整包弃用则损失
          # 549 条。(整份 JSON 里 `"severity":"MEDIUM"` 其实出现 12 次, 但多出的
          #  那次嵌套在规则内部、不参与 RuleSeverity 求值, 故清单是 11 条。)
          #
          # 注意: 远端 pack 随时会变, **这份清单只是今天的补丁**。真正的长期保障
          # 是上面那行「崩溃必须非零退出」—— 下次 pack 再出坏规则, 门禁会红,
          # 而不是继续装绿。
          "$RUNNER_TEMP/semgrep-venv/bin/semgrep" scan \
            --config p/rust \
            --config p/security-audit \
            --config p/secrets \
            --config p/owasp-top-ten \
            --exclude-rule=package_managers.bun.bun-missing-minimum-release-age.bun-missing-minimum-release-age \
            --exclude-rule=package_managers.dependabot.dependabot-missing-cooldown.dependabot-missing-cooldown \
            --exclude-rule=package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age \
            --exclude-rule=package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies \
            --exclude-rule=package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age \
            --exclude-rule=package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy \
            --exclude-rule=package_managers.renovate.renovate-missing-minimum-release-age.renovate-missing-minimum-release-age \
            --exclude-rule=package_managers.uv.uv-missing-dependency-cooldown.uv-missing-dependency-cooldown \
            --exclude-rule=package_managers.yarn.yarn-missing-minimal-age-gate.yarn-missing-minimal-age-gate \
            --exclude-rule=package_managers.poetry.poetry-missing-solver-min-release-age.poetry-missing-solver-min-release-age \
            --exclude-rule=package_managers.ruby.bundler-gemfile-missing-cooldown.bundler-gemfile-missing-cooldown \
            --error \
            --metrics=off \
            --disable-version-check \
            .
        # `--error` 让**有 finding 就 exit 1**。没有它的话 semgrep 找到问题也返回 0,
        # 门禁依旧形同虚设。上面 29 条 finding 已全部修掉(见 gap-ledger §1.24),
        # 当前基线为 0, 故开 --error 不会立刻红。
      - name: ps1 encoding lint (Windows PowerShell 5.1 兼容)
        # 仓库内 .ps1 在 Windows PowerShell 5.1 下按系统 ANSI(GBK) 解码无 BOM 文件,
        # 中文后的引号会被 GBK 双字节规则吞掉, 脚本直接 ParserError 崩。
        # 本检查为纯字节操作, 无需 Windows runner, ubuntu 上行为一致。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/lint-ps1-encoding.ps1
      - name: ps1 encoding lint 变异测试 (门禁自身会不会恒绿)
        # 2026-10-07 实测: lint-ps1-encoding.ps1 曾因「排除模式拿绝对路径去
        # match」而在**任何 worktree 内恒绿** —— $repoRoot 自身含 \.worktrees\,
        # 每个文件的 FullName 都命中排除, 扫到 0 个文件并走「未发现 .ps1」分支
        # 报 OK 退出。也就是说这个门禁从来没在子代理的工作树里检查过任何东西,
        # 而 CI 一直在跑它、一直是绿的。
        #
        # 关键: **只跑一次正常路径证明不了这件事** —— 恒绿的旧代码同样会绿。
        # 必须是「改坏 -> 必须红」, 且红在正确的位置(改 1 个只点名 1 个;
        # 排除吃掉全部必须 exit 2 而不是 exit 0)。
        # 门禁因此带了 -RepoRoot / -ExcludeSegments 两个仅供本测试使用的参数。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-lint-ps1-encoding.ps1
      - name: package platform mapping regression (build-package 纯函数)
        # 2026-10-06 新增。`scripts/build-package.ps1` 里「平台 → 包名后缀/二进制
        # 扩展名」此前写死 win-x64 + .exe, 而 CI runner 是 Linux —— 即「CI 全绿
        # 但 Linux 上根本产不出包」。修法把它抽成纯函数 Get-PackageTarget, 于是
        # 「Linux 上会得到什么」可以在**一台 Windows 机器**上被断言。
        #
        # 放在本 job 而非新 job: 纯 PowerShell, 不需要 cargo, 与上面各 ps1 门禁同构。
        # 不放在 dist job 里: dist job 要编译整个 workspace, 挂了会先死在编译上,
        # 看不到是平台映射坏了。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/test-build-package.ps1

  dist-linux:
    name: Distributable (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # 同其余 job: 钉 action 的 SHA, 同时用 toolchain 保留「跟随最新 stable」。
          toolchain: stable
      - name: install protoc
        # 同其余 job 的同名校验: ubuntu runner 不预装 protoc, 缺失会让 im-proto 的
        # build.rs 失败, 进而让下面的 release 构建失败。
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: build distributable package
        # 刻意**调用仓内脚本**而不是在 CI 里手写 cargo 命令:
        # ① 被验证的是真正会发出去的那段代码(脚本此前在 Linux 上必然失败);
        # ② `--locked` 已经在脚本里, 不在这里重复写一遍以免两处漂移;
        # ③ 脚本按**运行平台**命名包, 所以 ubuntu runner 产出 im1.0-<版本>-linux-x64,
        #    不需要在本 job 里指定平台 —— 指定了就等于把平台又写死一遍。
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/build-package.ps1 -OutDir dist
      - name: resolve artifact name
        # artifact 名带版本与 commit 前缀: 版本让人认得出是哪一版, commit 前缀
        # 让同一版的不同构建可区分(v4 的 artifact 名在一次 run 内必须唯一)。
        # 名字从**实际产出的文件名**推导, 不再解析一遍 Cargo.toml 的 version ——
        # 免得这里的解析逻辑与脚本里的解析逻辑各自漂移。
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          shasum_out=$(ls -1 dist/im1.0-*-linux-x64.zip)
          count=$(printf '%s\n' "$shasum_out" | wc -l)
          if [ "$count" -ne 1 ]; then
            echo "::error::期望恰好 1 个 linux-x64 包, 实际 $count 个: $shasum_out"
            exit 1
          fi
          base=$(basename "$shasum_out" .zip)
          sha=$(git rev-parse --short HEAD)
          echo "name=${base}-${sha}" >> "$GITHUB_OUTPUT"
          echo "artifact: ${base}-${sha}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/im1.0-*-linux-x64.zip
          # fail-closed: glob 没命中时报错而不是静默传一个空 artifact。
          # 「传了但里面是空的」与「没传」在下游看来是一样的绿灯。
          if-no-files-found: error
