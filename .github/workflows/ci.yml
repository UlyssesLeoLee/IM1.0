name: CI

on:
  # 2026-10-02 修:dev 是车道合入的集成分支,原先只监听 main,
  # 导致 dev 上所有真实改动从不跑 CI(静默系统性缺口)。
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

# 4 个 job: lint / test-unit / test-integration / sast
# 全部用 PostgreSQL 18.6 服务(与 BasicDesign §5 一致,2026-08-26 锁 patch 18.6)

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: aux-01 naming check
        run: |
          # 占位,恒通过:本步骤不做任何自动检查,只 echo,不能当门禁看。
          # aux-01 §J 命名约定目前无工具强制;clippy 不含命名规范检查,
          # 也未接入 sqlfluff / buf lint。后续 PR 补实现时再改这里。
          echo "placeholder: no automated aux-01 §J naming check is enforced here"

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: im
          POSTGRES_PASSWORD: im
          POSTGRES_DB: im_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://im:im@localhost:5432/im_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (unit)
        run: cargo test --workspace --lib --no-fail-fast

  test-integration:
    name: Integration Tests (PG + migrations)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: im
          POSTGRES_PASSWORD: im
          POSTGRES_DB: im_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://im:im@localhost:5432/im_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: install sqlx-cli
        # 2026-10-02 修:版本对齐 workspace 依赖 sqlx = "0.9"(Cargo.lock 解析 0.9.0)。
        # 原为 '^0.8',是 2026-08-26 sqlx 0.8.6 → 0.9.0 升级时漏改的残留。
        run: cargo install sqlx-cli --version '^0.9' --no-default-features --features rustls,postgres --locked
      - name: run migrations
        run: sqlx migrate run --database-url $DATABASE_URL
      - name: cargo test (integration)
        # 2026-10-02 修正:集成用例已不"尚少"——crates/*/tests/ 共 6 个文件 66 个
        # #[test]/#[tokio::test],其中 pg_repos_integration.rs 的 22 个跑真实 PG。
        # 命令保持 cargo test --workspace:它会连 lib tests 一起跑(与 test-unit 重叠),
        # 这是既有行为,不在本次修正范围内。
        run: cargo test --workspace --no-fail-fast

  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit
          cargo audit
      - name: check error codes consistency (aux-03)
        run: |
          # 占位,恒通过:本步骤不校验错误码,只 echo,不能当门禁看。
          # 2026-10-02 修正:原注释引用 scripts/check_error_codes.sh,但该文件不存在
          # (scripts/ 下无此脚本),aux-03 §B 的一致性目前全靠人工 review。
          echo "placeholder: no automated aux-03 §B error-code check is enforced here"
      - name: semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/rust
            p/security-audit
            p/secrets
            p/owasp-top-ten
