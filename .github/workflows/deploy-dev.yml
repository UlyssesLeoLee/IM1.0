name: Deploy Dev
on:
  # 2026-10-02 决策:有意不把 dev 加进来(与 ci.yml 不同)。
  # 每次合入 dev 都自动部署 = 每次合并都对共享 K3s dev 集群跑一遍 apply + 迁移 Job;
  # 且 concurrency.cancel-in-progress=false,突发合并的部署会排队而非取消,
  # 重叠的迁移 Job 不可重入,有把共享 dev 环境搞脏的风险 —— 属于放大爆炸半径,不静默开启。
  # dev 的部署走 workflow_dispatch(手动选 dev ref),入口见下方 inputs。
  # 若要改为 dev 自动部署:先跑通一次 workflow_dispatch 手动部署再开,并复核迁移 Job 的幂等性。
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_smoke:
        description: "Skip smoke test (manual deploy only)"
        required: false
        default: "false"

concurrency:
  group: deploy-dev
  cancel-in-progress: false    # 部署排队不取消

jobs:
  deploy:
    name: Deploy to K3s dev
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG_DEV }}
        run: |
          mkdir -p ~/.kube
          echo "$KUBECONFIG_SECRET" | base64 -d > ~/.kube/config

      - name: Apply secrets first (if changed)
        run: |
          # 实际部署用 sealed-secrets,本步骤是占位
          if [ -f deploy/k3s/dev/secrets-template.yaml ]; then
            echo "WARN: secrets-template.yaml contains placeholders, skipping apply"
            echo "      Use: kubectl apply -f <sealed-secret.yaml> (post-rotation)"
          fi

      - name: Apply manifests
        run: |
          kubectl apply -k deploy/k3s/dev/ -n im1-dev
          kubectl rollout status deployment/postgres -n im1-dev --timeout=5m
          kubectl rollout status deployment/valkey -n im1-dev --timeout=2m
          kubectl rollout status deployment/nats -n im1-dev --timeout=2m
          kubectl rollout status deployment/im-gateway -n im1-dev --timeout=5m

      - name: Run migrations
        run: |
          # 2026-10-02 修:原先主路径建的是 job/im-migrate-manual,下一行却固定
          # 等 job/im-migrate,名字对不上 → 每次 dev 部署都在此 2 分钟超时失败。
          # 保留 -manual 后缀(避免与 cronjob 生成的 im-migrate-<timestamp> 撞名),
          # 改为按实际走的路径决定等待哪个 job 名。
          JOB_NAME=im-migrate-manual
          kubectl create job --from=cronjob/im-migrate-cronjob "$JOB_NAME" -n im1-dev 2>/dev/null || {
            kubectl apply -f deploy/k3s/dev/migrate-job.yaml -n im1-dev
            JOB_NAME=im-migrate
          }
          kubectl wait --for=condition=complete "job/$JOB_NAME" -n im1-dev --timeout=2m

      - name: Smoke test
        # 2026-10-02 修:原条件带 github.event_name == 'push',导致手动 dispatch
        # 永远跳过 smoke,与 skip_smoke 输入描述("manual deploy only")正好相反,
        # 且让该输入形同虚设。改为只由 skip_smoke 控制:push 时 inputs 为空 → 照旧执行。
        if: ${{ !inputs.skip_smoke }}
        run: |
          # 等待 im-gateway 就绪
          for i in {1..30}; do
            if kubectl get pods -n im1-dev -l app=im-gateway -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null | grep -q true; then
              break
            fi
            sleep 2
          done

          # 端口转发 + 测 healthz / readyz
          kubectl port-forward -n im1-dev svc/im-gateway 18080:8080 &
          PF_PID=$!
          sleep 3

          echo "=== /healthz ==="
          curl -sf http://localhost:18080/healthz | jq .
          echo "=== /readyz ==="
          curl -sf http://localhost:18080/readyz | jq .

          kill $PF_PID
        env:
          IM_BASE_URL: https://im-dev.example.com

      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          payload: |
            {
              "text": "IM1.0 dev deploy ${{ job.status }}: ${{ github.event.head_commit.message }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
