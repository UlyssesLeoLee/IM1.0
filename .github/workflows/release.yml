name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: im-gateway
            dockerfile: docker/im-gateway.Dockerfile
          - image_name: im-core
            dockerfile: docker/im-core.Dockerfile
          - image_name: im-migrate
            dockerfile: docker/im-migrate.Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/im1.0-${{ matrix.image_name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/im1.0-${{ matrix.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false    # MVP:跳过 SLSA provenance,V1 启用
          sbom: false

  release-notes:
    name: Generate Release Notes
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate notes
        run: |
          cat > $GITHUB_STEP_SUMMARY <<EOF
          # Release ${{ github.ref_name }}

          ## 镜像

          - ghcr.io/${{ github.repository_owner }}/im1.0-im-gateway:${{ github.ref_name }}
          - ghcr.io/${{ github.repository_owner }}/im1.0-im-core:${{ github.ref_name }}
          - ghcr.io/${{ github.repository_owner }}/im1.0-im-migrate:${{ github.ref_name }}

          ## 变更

          \`\`\`
          $(git log --pretty=format:'%h %s' ${{ github.event.before }}..HEAD 2>/dev/null | head -30 || echo "N/A")
          \`\`\`
          EOF
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
