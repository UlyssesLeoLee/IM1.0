name: Release
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image_name: im-gateway
            dockerfile: docker/im-gateway.Dockerfile
          - image_name: im-core
            dockerfile: docker/im-core.Dockerfile
          - image_name: im-migrate
            dockerfile: docker/im-migrate.Dockerfile
    steps:
      # 2026-10-04: 全部 action 由 tag 改为钉 commit SHA(依据: semgrep
      # `github-actions-mutable-action-tag`)。本 workflow 能拿到 ghcr.io 的
      # 推送凭据(packages: write), 属于**高价值凭据**, 被重指向的代价极高。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          # `@stable` 是分支语义(「用最新 stable Rust」), 钉 SHA 后须显式保留
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/im1.0-${{ matrix.image_name }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/im1.0-${{ matrix.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false    # MVP:跳过 SLSA provenance,V1 启用
          sbom: false

  release-notes:
    name: Generate Release Notes
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Generate notes
        # 2026-10-04 修 semgrep `run-shell-injection`(真问题, 非误报)。
        #
        # `${{ }}` 是**文本替换, 不是变量传递**: 替换发生在 shell 解析**之前**,
        # 所以 `github.ref_name` 里的 `$(...)` / 反引号会被 shell 当成命令执行。
        # 分支/标签名由推送者完全控制 —— 本 workflow 是 tag 触发(`v*.*.*`),
        # 标签名同样可任意构造, 所以这是可达的攻击面, 不是理论风险。
        # 另: 原写法还把 `$GITHUB_STEP_SUMMARY` 未加引号直接内插, 属同一类毛病。
        #
        # 正解: 经 `env:` 传入, 在脚本里只用 `"$VAR"` 引用 —— 此后它们就是
        # 普通字符串, 不再参与语法解析。`github.event.before` 是 commit SHA,
        # 风险低, 但同一条 run 里一并处理, 免得留下「这里可以随便插值」的先例。
        env:
          REF_NAME: ${{ github.ref_name }}
          REPO_OWNER: ${{ github.repository_owner }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          {
            echo "# Release ${REF_NAME}"
            echo
            echo "## 镜像"
            echo
            echo "- ghcr.io/${REPO_OWNER}/im1.0-im-gateway:${REF_NAME}"
            echo "- ghcr.io/${REPO_OWNER}/im1.0-im-core:${REF_NAME}"
            echo "- ghcr.io/${REPO_OWNER}/im1.0-im-migrate:${REF_NAME}"
            echo
            echo "## 变更"
            echo
            echo '```'
            # 用 `-n 30` 而**不是** `| head -30`: 开启 pipefail 后, 管道左侧收
            # SIGPIPE 会返回非零, 导致 `|| echo "N/A"` 在日志超过 30 条时**误触发**,
            # 于是在真实变更列表后面凭空多一个 "N/A"。`-n` 是 git 自己的限制,
            # 没有管道也就没有这个问题。
            git log -n 30 --pretty=format:'%h %s' "${EVENT_BEFORE}..HEAD" 2>/dev/null || echo "N/A"
            echo
            echo '```'
          } > "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
          draft: false
