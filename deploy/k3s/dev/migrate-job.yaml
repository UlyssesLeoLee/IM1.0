# 数据库迁移 Job —— 独立运行(ImplementationSpec §8.2 修订方案)
# 用于 CI/CD 流水线触发,而非 init container
# 依据: ImplementationSpec §8.2
apiVersion: batch/v1
kind: Job
metadata:
  name: im-migrate
  namespace: im1-dev
spec:
  ttlSecondsAfterFinished: 86400    # 完成后保留 24h 用于日志查询
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-db
          image: postgres:18
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: ghcr.io/yourorg/im1.0-im-migrate:latest
          command: ["sqlx", "migrate", "run"]
          env:
            - name: IM_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: im-core-env
                  key: database-url
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
