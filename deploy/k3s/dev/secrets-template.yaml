# Secrets 模板 —— 实际部署请用 sealed-secrets 或 external-secrets-operator
# 依据: BasicDesign §14.4 + ImplementationSpec §6.4
#
# 警告:本文件包含占位符,不得直接 commit 到 main 后 kubectl apply
# 推荐:用 sealed-secrets 加密后 commit,运行时由 controller 解密

apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: im1-dev
  annotations:
    im1.0.io/secret-type: pg-credentials
type: Opaque
stringData:
  # === 占位符:实际值由部署工具注入 ===
  #
  # 2026-10-04 新增。此前本模板**只声明了 im-core-env**, 而下面两个清单都在引用
  # 一个根本不存在的 Secret:
  #   postgres.yaml  x3  (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB)
  #   im-gateway.yaml x2  (IM_POSTGRES_URL)
  # 少它时 postgres 容器拿不到凭据 -> CreateContainerConfigError ->
  # Pod 卡在 ContainerCreating, **整个 namespace 起不来**。没人发现是因为
  # 部署端到端从未跑通(F-2/F-3), 且镜像也从未构建过(见 §1.25)。
  #
  # 为什么要与 im-core-env 分开: 两者**消费方不同**。
  #   - postgres.yaml 用 username/password/database 三个独立键去初始化 PG 实例
  #   - 应用侧要的是一条**完整连接串** database-url
  # 合并成一个 Secret 会让「改 PG 密码」和「改应用连接串」变成同一次操作,
  # 而这两件事在轮换期本来就可以不同步。
  username: "im"
  password: "REPLACE_ME"
  database: "im1"
  # im-gateway 与其 run-migrations initContainer 从这里取 IM_POSTGRES_URL。
  # 注: im-core-env 里**也有**一个 database-url 键, 而 migrate-job.yaml 取的是
  # 那个 —— 两处来源不一致, 需要部署负责人定一个单一事实源。
  # 见 docs/gap-ledger.md §1.25 的待裁决项。
  database-url: "postgres://im:REPLACE_ME@postgres:5432/im1"
---
apiVersion: v1
kind: Secret
metadata:
  name: im-core-env
  namespace: im1-dev
  annotations:
    # 标记为本项目自定义 secret 类型,方便搜索
    im1.0.io/secret-type: app-config
type: Opaque
stringData:
  # === 占位符:实际值由部署工具注入 ===
  #
  # 2026-10-03 键名对齐:下面的键必须与 im-gateway.yaml 里 secretKeyRef 的
  # key 一一对应, 且**值必须是 im_common::config::AppConfig 能直接反序列化的形状**
  # (结构化字段给 JSON)。配错名字的表现是 Pod CrashLoopBackOff + 启动即报
  # `config load failed`, 而不是「配置没生效」。
  database-url: "postgres://im:changeme@postgres:5432/im1"
  # 事件发布器: 2026-10-03 新增键。原先没有, 而 `event_publisher` 是
  # **必填**字段(无 serde default) → 缺它时进程起不来。
  # kind=nats 时 nats_url 才被使用。
  event-publisher: '{"kind":"nats","nats_url":"nats://nats:4222"}'
  # 双密钥 JSON 数组(轮换期 2 个,平稳期 1 个)
  jwt-signing-keys: '[{"kid":"v1","key":"REPLACE_ME_HEX_64_BYTES","active":true}]'
  # 注意: 键名是 refresh-pepper, 对应 env 变量 IM_REFRESH_PEPPER
  # (不是 IM_REFRESH_TOKEN_PEPPER —— 那是对不上的旧名)
  refresh-pepper: "REPLACE_ME_HEX_64_BYTES"
  # HMAC X-IM-Server-Signature 按 env_id 取 secret。JSON 对象, 键是 environment UUID。
  # 留空对象 = 不启用 S2S token exchange 的 HMAC 验签(而不是配了一个错的)。
  server-secrets: '{"00000000-0000-0000-0000-000000000000":"REPLACE_ME_HEX_64_BYTES"}'
  # ── 以下键当前**没有任何 env 变量读取**, 保留仅作占位, 见注释 ──
  # valkey-url: D-4 (Valkey) 未落地, AppConfig 里没有对应字段
  # minio-*:    IM-MEDIA-001 依赖对象存储, media 端点未实装(WBS G-2 Blocked)
  # nats-url:   已并入上面的 event-publisher JSON, 不再单独用
---
# 各 environment 的 server_secret(按 env_id 一份)
# MVP 假设只 1 个 env = production
apiVersion: v1
kind: Secret
metadata:
  name: im-env-production
  namespace: im1-dev
  annotations:
    im1.0.io/secret-type: env-secret
type: Opaque
stringData:
  server_secret: "REPLACE_ME_HEX_64_BYTES"
