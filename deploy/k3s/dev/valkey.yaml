# Valkey (Redis 兼容) - MVP 单实例
# 依据: ImplementationSpec §13
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
  namespace: im1-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey
  template:
    metadata:
      labels:
        app: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 256Mi
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: im1-dev
spec:
  selector:
    app: valkey
  ports:
    - port: 6379
      targetPort: 6379
