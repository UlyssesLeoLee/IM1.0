# im-gateway Deployment
# 依据: ImplementationSpec §8.3 + §7.5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: im-gateway
  namespace: im1-dev
spec:
  replicas: 1    # MVP 单实例,V1 HPA on connection count
  selector:
    matchLabels:
      app: im-gateway
  template:
    metadata:
      labels:
        app: im-gateway
    spec:
      initContainers:
        - name: wait-for-postgres
          # 2026-10-04 semgrep allow-privilege-escalation: 容器须显式禁止提权
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: postgres:18.6
          command:
            - sh
            - -c
            - |
              until pg_isready -h postgres -p 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
        - name: run-migrations
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/yourorg/im1.0-im-migrate:latest
          # 2026-10-04 修(与 migrate-job.yaml 同一个缺陷, 当时只修了后者):
          #   1. 此前 `command: ["sqlx", "migrate", "run"]` 要求镜像里装 sqlx CLI,
          #      而 im-migrate 镜像装的是**仓内自带的 im-migrate 二进制**
          #      (`sqlx::migrate!` 把迁移编译期内嵌)。沿用 sqlx 命令会直接
          #      `exec: "sqlx": executable file not found`。
          #      现与 migrate-job.yaml 一致, 直接用镜像的 ENTRYPOINT。
          #   2. 此前写的是 `IM_DATABASE_URL` —— **这个变量名根本不存在**:
          #      `AppConfig` 的字段叫 `postgres_url`, 按仓内 `IM_<UPPER_SNAKE>`
          #      规则对应 `IM_POSTGRES_URL`(见 gap-ledger §1.17)。
          #      写错名字的表现是 im-migrate 非 0 退出, 迁移压根没跑,
          #      而本 initContainer 失败会连带网关起不来。
          #
          # 迁移已内嵌进二进制, **不需要**再挂 migrations/ 目录 ——
          # 二进制携带的迁移与编译它的代码必然同版本。
          env:
            - name: IM_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
      containers:
        - name: im-gateway
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          image: ghcr.io/yourorg/im1.0-im-gateway:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            # ── 2026-10-03 逐项核对过 im_common::config::AppConfig 的字段名 ──
            #
            # 此前这份清单 8 个变量里 **6 个**与代码对不上, 而 im-gateway 在
            # 容器里**必然启动失败**: `AppConfig::load()` 传 config_dir=None,
            # 生产环境不读任何 TOML, 唯一配置来源就是 env; 而必填字段
            # `postgres_url` 的正确名字是 `IM_POSTGRES_URL`。名字写错 → 反序列化
            # 失败 → 进程起不来。详见 docs/gap-ledger.md §1.17。
            #
            # 规则: `IM_<UPPER_SNAKE>` → `AppConfig` 同名小写字段。
            # 结构化字段(Vec / HashMap / 嵌套 struct)给 **JSON**, 见 config.rs。
            - name: IM_HTTP_PORT
              value: "8080"
            - name: IM_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: database-url
            - name: IM_JWT_SIGNING_KEYS
              valueFrom:
                secretKeyRef:
                  name: im-core-env
                  key: jwt-signing-keys
            - name: IM_REFRESH_PEPPER
              valueFrom:
                secretKeyRef:
                  name: im-core-env
                  key: refresh-pepper
            - name: IM_EVENT_PUBLISHER
              valueFrom:
                secretKeyRef:
                  name: im-core-env
                  key: event-publisher
            # HMAC X-IM-Server-Signature 按 env_id 取 secret (S2S token exchange)
            - name: IM_SERVER_SECRETS
              valueFrom:
                secretKeyRef:
                  name: im-core-env
                  key: server-secrets
          # Valkey (D-4) 未落地前**没有**对应 env: 配置里没有 valkey 字段。
          # 写一个读不掉的 IM_VALKEY_URL 只会让人以为「配了就能用」。
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 256Mi
              cpu: 200m
            limits:
              memory: 512Mi
              cpu: 1000m
---
apiVersion: v1
kind: Service
metadata:
  name: im-gateway
  namespace: im1-dev
spec:
  selector:
    app: im-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    # 2026-10-03 删除 gRPC 9000: im-gateway **没有** gRPC server
    # (`grep -rn 9000 crates/im-gateway/src` 无命中)。proto 里的 CoreService
    # 由 im-gateway **进程内直接调 im-core**, 不走网络 —— 声明一个永不监听的
    # 端口, 只会让 Service 的使用者以为有一个可连的 gRPC 端点。
    # 若将来真要独立 gRPC 服务, 那是另一个进程的事, 需另配。
