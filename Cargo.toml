[workspace]
members = [
    "crates/im-common",
    "crates/im-proto",
    "crates/im-protocol",
    "crates/im-core",
    "crates/im-gateway",
    "crates/im-presence",
    "crates/im-media",
    "crates/extension-runtime",
    "crates/im-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
authors = ["IM1.0 Team"]
license = "Apache-2.0"
repository = "https://github.com/{org}/im1.0"
homepage = "https://github.com/{org}/im1.0"
documentation = "https://github.com/{org}/im1.0/tree/main/docs"

[workspace.dependencies]
# ---- Web 框架 ----
actix-web = "4"
actix-ws = "0.3"
actix-web-httpauth = "0.8"
actix-cors = "0.7"
actix-rt = "2"

# ---- 异步运行时 ----
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# ---- 数据库 ----
# 2026-08-26 升级:0.8.6 → 0.9.0(0.8.x 无 0.8.7+ patch,0.8.6 在 cargo 1.98 + rustc 1.98
# 上 sqlx-macros-core 出现 E0220 "Output not found for F" + "cannot determine
# resolution for the derive macro Debug";0.9.0 (2026-05-21) 已修复)
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "chrono",
    "json",
] }

# ---- 缓存 / KV ----
# NOTE: redis 0.27 的 tls-rustls feature 与 tokio_rustls 不兼容(MVP 暂不启用 TLS,V1+ 处理)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# ---- 事件总线 ----
# 2026-08-26 升级:0.37.0 → 0.50.0(0.37.0 在 cargo 1.98 上编译期 STATUS_STACK_BUFFER_OVERRUN
# / 6 MB 内存分配失败;0.50.0 (2026-07-20) 是当前最新 stable,默认 features 含 server_2_14/ring/
# jetstream/websockets/kv/object-store,ImSpec §6 NATS Secret Key 不变,仅 publisher.rs 占位代码
# 需在实装阶段核对 0.50 API 命名空间)
async-nats = "0.50"

# ---- 序列化 ----
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"

# ---- ID / 时间 ----
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# ---- 错误处理 ----
thiserror = "1"
anyhow = "1"
strum = { version = "0.26", features = ["derive"] }

# ---- 密码 / Token ----
argon2 = "0.5"
jsonwebtoken = "11"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# ---- 媒体 (MinIO S3 兼容) ----
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"

# ---- 可观测性 ----
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-actix-web = "0.7"
# 2026-08-26 升级:0.13 → 0.14 + default-features = false(0.13.4 拉 protobuf 2.28.0,
# 后者在 cargo 1.98 / rustc 1.98 上 codegen 阶段触发 STATUS_STACK_BUFFER_OVERRUN 0xc0000409,
# test target 必触发;0.14 (2026-03 发布) 仍 default-features = ["protobuf"] (protobuf 3.x),
# 故需显式 default-features = false。仓库内 placeholder.rs / health.rs 仅占位未调用
# prometheus API,protobuf 不开 OK。V1 实装 metrics 时再启 protobuf feature)
prometheus = { version = "0.14", default-features = false }
opentelemetry = "0.24"
opentelemetry_sdk = { version = "0.24", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.17", features = ["grpc-tonic"] }
opentelemetry-semantic-conventions = "0.16"
# tracing ↔ OpenTelemetry bridge. 0.25 aligns with opentelemetry 0.24 (workspace).
# 0.26+ bumps to opentelemetry 0.25; lock to 0.25 until the rest of the stack moves.
tracing-opentelemetry = "0.25"

# ---- gRPC ----
tonic = "0.12"
tonic-build = "0.12"
prost = "0.13"
prost-types = "0.13"

# ---- 配置 / 密钥 ----
figment = { version = "0.10", features = ["env", "toml"] }
dotenvy = "0.15"
secrecy = { version = "0.8", features = ["serde"] }

# ---- 通用工具 ----
once_cell = "1"
parking_lot = "0.12"
# 2026-08-26 移除:dashmap 6.2.1 (最新 stable 也是 6.2.1) 在 cargo 1.98 + rustc 1.98
# 上因 `Self::Output` 在新版 trait 推导时撞上 `IntoFuture::Output` /
# `AsyncFnOnce::Output` / `FnOnce::Output` 等新增关联类型,出现 5 × E0223 ambiguous
# associated type,dashmap 自身 src/lib.rs:1267-1303 触发。
# IM1.0 仓库 0 处实际调用 (grep 验证),im-core 仅 Cargo.toml 声明,
# 故直接移除依赖,不替换 (未来 V1+ 若需并发 map 选 parking_lot::Mutex<HashMap>)

# ---- 测试 ----
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres", "redis"] }
proptest = "1"
mockall = "0.13"
criterion = { version = "0.5", features = ["html_reports"] }

# ---- 内部依赖 ----
im-common = { path = "crates/im-common" }
im-proto = { path = "crates/im-proto" }
im-protocol = { path = "crates/im-protocol" }
im-core = { path = "crates/im-core" }
im-gateway = { path = "crates/im-gateway" }
im-presence = { path = "crates/im-presence" }
im-media = { path = "crates/im-media" }
extension-runtime = { path = "crates/extension-runtime" }
im-testkit = { path = "crates/im-testkit" }

# ---- ACI 跨项目 emitter (per ULYS-191 §4.3.3 brief v0.1) ----
# 守门 #11 缺标比错标: git dep 锁 rev=df28c56 (= ULYS-191.1 / ULYS-224 main HEAD)
aci-emitter = { git = "https://github.com/UlyssesLeoLee/aci-emitter", rev = "df28c56" }

# ---- 共享编译 profile ----
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
debug = false

[profile.dev]
opt-level = 0
debug = true
incremental = true

[profile.test]
opt-level = 0
debug = true
